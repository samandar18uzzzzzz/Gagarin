<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yaqin — yolg'iz emassan</title>

<!-- ============================================================= -->
<!--  1-QADAM:  Quyidagi 2 ta qatorga Supabase kalitlaringni qo'y  -->
<!--  (Pastdagi qo'llanmada qaerdan olishni aytaman)               -->
<!-- ============================================================= -->
<script>
  const SUPABASE_URL = "https://thoupvszrazjvocahbev.supabase.co/rest/v1/";
  const SUPABASE_KEY = "sb_publishable_8EzKs5PADmA3wZzwDSnlEw_1pmZ67no";
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f;
    --panel:#12121a;
    --panel-2:#181824;
    --line:#23232f;
    --txt:#ececf2;
    --muted:#7a7a8c;
    --accent:#ff6a3d;
    --accent-2:#ffd166;
    --me:#ff6a3d;
    --them:#1e1e2a;
    --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--txt);
    font-family:'Manrope',sans-serif;
    background-image:radial-gradient(1200px 600px at 80% -10%, rgba(255,106,61,.10), transparent),
                     radial-gradient(900px 500px at -10% 110%, rgba(255,209,102,.07), transparent);
  }
  .app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}

  /* ---------- LOGIN ---------- */
  .login{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px;text-align:center;gap:22px}
  .logo{font-family:'Unbounded';font-weight:800;font-size:42px;letter-spacing:-1px;
        background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{color:var(--muted);font-size:15px;max-width:300px;line-height:1.5}
  .login input{width:100%;max-width:320px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);
        border-radius:14px;color:var(--txt);font-size:16px;font-family:inherit;outline:none}
  .login input:focus{border-color:var(--accent)}
  .btn{width:100%;max-width:320px;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;
        font-family:inherit;color:#0a0a0f;background:linear-gradient(120deg,var(--accent),var(--accent-2));cursor:pointer}
  .btn:active{transform:scale(.98)}
  .err{color:#ff5a6a;font-size:14px;min-height:18px}

  /* ---------- HEADER ---------- */
  header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(18,18,26,.8);backdrop-filter:blur(12px)}
  header .back{font-size:24px;color:var(--accent);background:none;border:none;cursor:pointer;display:none}
  header h1{font-family:'Unbounded';font-size:18px;font-weight:600;flex:1}
  header .me{font-size:13px;color:var(--muted)}

  /* ---------- ROOMS ---------- */
  .rooms{flex:1;overflow-y:auto;padding:14px}
  .room{display:flex;align-items:center;gap:14px;padding:16px;background:var(--panel);border:1px solid var(--line);
        border-radius:var(--radius);margin-bottom:12px;cursor:pointer;transition:.15s}
  .room:active{transform:scale(.98);border-color:var(--accent)}
  .room .emoji{font-size:28px;width:48px;height:48px;display:grid;place-items:center;background:var(--panel-2);border-radius:14px}
  .room .info{flex:1}
  .room .info h3{font-size:16px;font-weight:700;margin-bottom:3px}
  .room .info p{font-size:13px;color:var(--muted)}

  /* ---------- CHAT ---------- */
  .chat{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4;word-wrap:break-word;animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg .name{font-size:12px;font-weight:700;color:var(--accent-2);margin-bottom:3px}
  .msg img{max-width:100%;border-radius:12px;margin-top:6px;display:block}
  .msg.them{align-self:flex-start;background:var(--them);border-bottom-left-radius:4px}
  .msg.me{align-self:flex-end;background:linear-gradient(120deg,var(--accent),#ff8a5d);color:#1a0a04;border-bottom-right-radius:4px}
  .msg.me .name{color:#5a2410}
  .time{font-size:10px;opacity:.6;margin-top:4px;text-align:right}

  /* ---------- COMPOSER ---------- */
  .composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
  .composer .imgbtn{font-size:22px;background:var(--panel-2);border:1px solid var(--line);border-radius:50%;width:44px;height:44px;cursor:pointer;color:var(--txt);flex-shrink:0}
  .composer textarea{flex:1;resize:none;max-height:100px;padding:11px 14px;background:var(--panel-2);border:1px solid var(--line);
        border-radius:22px;color:var(--txt);font-size:15px;font-family:inherit;outline:none}
  .composer textarea:focus{border-color:var(--accent)}
  .composer .send{width:44px;height:44px;border-radius:50%;border:none;font-size:20px;cursor:pointer;flex-shrink:0;
        background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0a0a0f}
  .composer .send:active{transform:scale(.92)}
  .preview{padding:8px 12px;display:none;align-items:center;gap:10px;border-top:1px solid var(--line);background:var(--panel)}
  .preview img{height:48px;border-radius:8px}
  .preview button{margin-left:auto;background:none;border:none;color:#ff5a6a;font-size:14px;cursor:pointer}
  .empty{text-align:center;color:var(--muted);margin:auto;padding:40px;font-size:14px;line-height:1.6}
  .hidden{display:none!important}
  .config-warn{margin:auto;text-align:center;padding:40px;color:#ffd166;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<div class="app">

  <!-- LOGIN -->
  <div class="login" id="loginView">
    <div class="logo">Yaqin</div>
    <div class="tag">Zerikkanmisan? Yolg'izmisan? Bu yerda gaplashadigan odam doim bor.</div>
    <input id="nameInput" placeholder="Isming (yoki taxallus)" maxlength="20">
    <button class="btn" id="enterBtn">Kirish</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- HEADER -->
  <header class="hidden" id="hdr">
    <button class="back" id="backBtn">‹</button>
    <h1 id="hdrTitle">Bo'limlar</h1>
    <span class="me" id="meLabel"></span>
  </header>

  <!-- ROOMS -->
  <div class="rooms hidden" id="roomsView"></div>

  <!-- CHAT -->
  <div class="chat hidden" id="chatView">
    <div class="messages" id="messages"></div>
    <div class="preview" id="preview">
      <img id="previewImg" alt="">
      <span style="font-size:13px;color:var(--muted)">Rasm tayyor</span>
      <button id="removeImg">O'chirish</button>
    </div>
    <div class="composer">
      <button class="imgbtn" id="imgBtn">🖼️</button>
      <input type="file" id="fileInput" accept="image/*" class="hidden">
      <textarea id="msgInput" rows="1" placeholder="Yoz..."></textarea>
      <button class="send" id="sendBtn">➤</button>
    </div>
  </div>

</div>

<script>
/* ====================== BO'LIMLAR ====================== */
const ROOMS = [
  {id:"umumiy",   emoji:"💬", name:"Umumiy suhbat", desc:"Hamma kiradigan asosiy xona"},
  {id:"yolgizlik",emoji:"🌙", name:"Yolg'izlik",     desc:"Yuragingni bo'shat, tinglashadi"},
  {id:"dard",     emoji:"🫂", name:"Dardlashish",    desc:"Qiyin paytda yon beradigan joy"},
  {id:"qiziq",    emoji:"✨", name:"Tanishuv",       desc:"Yangi do'st topish"},
  {id:"tun",      emoji:"🌃", name:"Tungi xona",     desc:"Uxlolmaganlar uchun"},
];

let sb=null, me=null, currentRoom=null, channel=null, pendingImage=null;

/* ====================== ELEMENTLAR ====================== */
const $ = id => document.getElementById(id);
const loginView=$("loginView"), roomsView=$("roomsView"), chatView=$("chatView"),
      hdr=$("hdr"), hdrTitle=$("hdrTitle"), meLabel=$("meLabel"), backBtn=$("backBtn"),
      messages=$("messages"), msgInput=$("msgInput"), sendBtn=$("sendBtn"),
      imgBtn=$("imgBtn"), fileInput=$("fileInput"), preview=$("preview"),
      previewImg=$("previewImg"), removeImg=$("removeImg");

/* ====================== KIRISH ====================== */
$("enterBtn").onclick = () => {
  const name = $("nameInput").value.trim();
  if(name.length < 2){ $("loginErr").textContent = "Kamida 2 ta harf yoz"; return; }

  if(SUPABASE_URL.includes("BU_YERGA") || SUPABASE_KEY.includes("BU_YERGA")){
    $("loginErr").textContent = "Supabase kaliti hali qo'yilmagan (qo'llanmaga qara)";
    return;
  }
  me = name;
  try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }
  catch(e){ $("loginErr").textContent="Ulanishda xato: "+e.message; return; }

  loginView.classList.add("hidden");
  hdr.classList.remove("hidden");
  meLabel.textContent = "👤 "+me;
  showRooms();
};

/* ====================== XONALAR RO'YXATI ====================== */
function showRooms(){
  currentRoom=null;
  if(channel){ sb.removeChannel(channel); channel=null; }
  hdrTitle.textContent = "Bo'limlar";
  backBtn.style.display = "none";
  chatView.classList.add("hidden");
  roomsView.classList.remove("hidden");
  roomsView.innerHTML = "";
  ROOMS.forEach(r=>{
    const el = document.createElement("div");
    el.className="room";
    el.innerHTML = `<div class="emoji">${r.emoji}</div>
      <div class="info"><h3>${r.name}</h3><p>${r.desc}</p></div><div style="color:var(--muted)">›</div>`;
    el.onclick = () => openRoom(r);
    roomsView.appendChild(el);
  });
}

/* ====================== XONAGA KIRISH ====================== */
async function openRoom(room){
  currentRoom = room;
  roomsView.classList.add("hidden");
  chatView.classList.remove("hidden");
  hdrTitle.textContent = room.emoji+" "+room.name;
  backBtn.style.display = "block";
  messages.innerHTML = `<div class="empty">Yuklanmoqda...</div>`;

  // Eski xabarlarni olib kelish
  const { data, error } = await sb.from("messages")
    .select("*").eq("room", room.id).order("created_at",{ascending:true}).limit(100);

  messages.innerHTML="";
  if(error){ messages.innerHTML=`<div class="empty">Xato: ${error.message}<br>(Jadval yaratilganmi?)</div>`; return; }
  if(!data || data.length===0){
    messages.innerHTML=`<div class="empty">Hali xabar yo'q.<br>Birinchi bo'lib salom ber 👋</div>`;
  } else {
    data.forEach(addMessage);
    scrollDown();
  }

  // Real-time tinglash
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("room-"+room.id)
    .on("postgres_changes",
      { event:"INSERT", schema:"public", table:"messages", filter:"room=eq."+room.id },
      payload => {
        if(messages.querySelector(".empty")) messages.innerHTML="";
        addMessage(payload.new); scrollDown();
      })
    .subscribe();
}

/* ====================== XABARNI CHIZISH ====================== */
function addMessage(m){
  const el = document.createElement("div");
  el.className = "msg " + (m.name===me ? "me":"them");
  const t = new Date(m.created_at).toLocaleTimeString("uz",{hour:"2-digit",minute:"2-digit"});
  let html = `<div class="name">${esc(m.name)}</div>`;
  if(m.text) html += esc(m.text).replace(/\n/g,"<br>");
  if(m.image_url) html += `<img src="${m.image_url}" alt="rasm">`;
  html += `<div class="time">${t}</div>`;
  el.innerHTML = html;
  messages.appendChild(el);
}
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function scrollDown(){ setTimeout(()=>messages.scrollTop=messages.scrollHeight, 50); }

/* ====================== XABAR YUBORISH ====================== */
async function send(){
  const text = msgInput.value.trim();
  if(!text && !pendingImage) return;
  sendBtn.disabled = true;

  let image_url = null;
  if(pendingImage){
    const fname = `${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
    const { error:upErr } = await sb.storage.from("images").upload(fname, pendingImage);
    if(upErr){ alert("Rasm yuklanmadi: "+upErr.message); sendBtn.disabled=false; return; }
    image_url = sb.storage.from("images").getPublicUrl(fname).data.publicUrl;
  }

  const { error } = await sb.from("messages").insert({
    room: currentRoom.id, name: me, text: text||null, image_url
  });
  if(error){ alert("Yuborilmadi: "+error.message); sendBtn.disabled=false; return; }

  msgInput.value=""; msgInput.style.height="auto";
  clearImage();
  sendBtn.disabled = false;
  msgInput.focus();
}

/* ====================== RASM TANLASH ====================== */
imgBtn.onclick = () => fileInput.click();
fileInput.onchange = () => {
  const f = fileInput.files[0];
  if(!f) return;
  pendingImage = f;
  previewImg.src = URL.createObjectURL(f);
  preview.style.display = "flex";
};
removeImg.onclick = clearImage;
function clearImage(){ pendingImage=null; fileInput.value=""; preview.style.display="none"; }

/* ====================== HODISALAR ====================== */
sendBtn.onclick = send;
backBtn.onclick = showRooms;
msgInput.addEventListener("input", function(){
  this.style.height="auto"; this.style.height=Math.min(this.scrollHeight,100)+"px";
});
$("nameInput").addEventListener("keydown", e=>{ if(e.key==="Enter") $("enterBtn").click(); });
</script>
</body>
</html>
